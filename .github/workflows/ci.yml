name: CI

# Gate: server tests (replica-set MongoDB), client tests + lint + build, browser
# journeys, dependency audit and a Git tree/history secret scan.
#
# Parts 2+ write inside MongoDB transactions, so the database MUST be a replica
# set. Service containers cannot be started with `--replSet`, so each job starts
# a disposable single-node replica set with `docker run` and initiates it.

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  server:
    name: Server tests
    runs-on: ubuntu-latest
    env:
      NODE_ENV: test
      MONGODB_URI: mongodb://127.0.0.1:27017/velora_test?replicaSet=rs0
      MONGODB_TEST_URI: mongodb://127.0.0.1:27017/velora_test?replicaSet=rs0
      CLIENT_ORIGIN: http://localhost:5173
      SESSION_PEPPER: ci_test_session_pepper_0123456789
      MFA_ENCRYPTION_KEY: AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA=
      SESSION_TTL_HOURS: "12"
      DOCUMENT_STORAGE_ROOT: /tmp/velora-documents
      DOCUMENT_ENCRYPTION_KEY: BQUFBQUFBQUFBQUFBQUFBQUFBQUFBQUFBQUFBQUFBQU=
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm
      - name: Start MongoDB replica set
        run: |
          docker run -d --name mongo -p 27017:27017 mongo:7 --replSet rs0 --bind_ip_all
          for i in $(seq 1 30); do
            docker exec mongo mongosh --quiet --eval "db.adminCommand('ping').ok" >/dev/null 2>&1 && break
            sleep 2
          done
          docker exec mongo mongosh --quiet --eval "rs.initiate({_id:'rs0',members:[{_id:0,host:'127.0.0.1:27017'}]})"
          for i in $(seq 1 30); do
            [ "$(docker exec mongo mongosh --quiet --eval 'db.hello().isWritablePrimary')" = "true" ] && break
            sleep 2
          done
      - run: npm ci
      - name: Server tests
        run: npm test -w server

  client:
    name: Client tests, lint and build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Unit tests
        run: npm test -w client
      - name: Lint
        run: npm run lint -w client
      - name: Production build
        run: npm run build -w client

  e2e:
    name: Browser journeys
    runs-on: ubuntu-latest
    needs: [server, client]
    env:
      NODE_ENV: test
      PORT: "4100"
      MONGODB_URI: mongodb://127.0.0.1:27017/velora_e2e?replicaSet=rs0
      CLIENT_ORIGIN: http://localhost:5173
      SESSION_PEPPER: ci_test_session_pepper_0123456789
      MFA_ENCRYPTION_KEY: AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA=
      SESSION_TTL_HOURS: "12"
      DOCUMENT_STORAGE_ROOT: /tmp/velora-documents-e2e
      DOCUMENT_ENCRYPTION_KEY: BQUFBQUFBQUFBQUFBQUFBQUFBQUFBQUFBQUFBQUFBQU=
      VITE_API_PROXY: http://localhost:4100
      E2E_BASE_URL: http://localhost:5173
      # Part 6: the LOCAL deterministic provider (no network, no key). This is a
      # test-only value; the shipped default is `none` (see the fail-closed step).
      EXTRACTION_PROVIDER: fake
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Start MongoDB replica set
        run: |
          docker run -d --name mongo -p 27017:27017 mongo:7 --replSet rs0 --bind_ip_all
          for i in $(seq 1 30); do
            docker exec mongo mongosh --quiet --eval "db.adminCommand('ping').ok" >/dev/null 2>&1 && break
            sleep 2
          done
          docker exec mongo mongosh --quiet --eval "rs.initiate({_id:'rs0',members:[{_id:0,host:'127.0.0.1:27017'}]})"
          for i in $(seq 1 30); do
            [ "$(docker exec mongo mongosh --quiet --eval 'db.hello().isWritablePrimary')" = "true" ] && break
            sleep 2
          done
      - name: Install Playwright browser
        run: npx playwright install --with-deps chromium
      - name: Seed synthetic clinic
        run: npm run seed -w server
      - name: Start API
        # Captured PID so the provider-disabled journey can restart it below.
        run: |
          node server/src/index.js > /tmp/api.log 2>&1 &
          echo $! > /tmp/api.pid
      - name: Start client
        run: npm run dev -w client &
      - name: Wait for stack
        # Readiness is asserted with curl instead of an unpinned `npx wait-on`
        # download: no extra dependency enters the build (control #13, #14).
        run: |
          for i in $(seq 1 60); do
            if curl -fsS http://localhost:4100/api/health >/dev/null && \
               curl -fsS http://localhost:5173 >/dev/null; then
              echo "stack ready"
              exit 0
            fi
            sleep 2
          done
          echo "stack did not become ready" >&2
          exit 1
      - name: Browser journeys
        # Includes the axe accessibility audit, the 200 %/400 % zoom reflow
        # checks, the phone table-stacking checks and forced-colours mode.
        run: npx playwright test
      - name: Layout snapshot gate
        # L11: a deterministic gate on the numbers a layout regression moves
        # (page overflow, main box, stacked tables, heading). Pixel baselines
        # remain a manual capture; this step blocks the merge.
        run: node qa/layout-snapshot.js
      - name: Operational drills (restore and reconciliation)
        # Part 10: a backup nobody has restored is a hypothesis, so the restore
        # drill runs on every push against the seeded database. It restores rows,
        # indexes and the encrypted objects into an isolated drill database,
        # verifies them by reading them back (including decrypting stored
        # documents) and then drops the copy. The reconciliation report is
        # read-only: it must find no drift, and it never repairs without an
        # operator attribution. The key-rotation re-seal runs in its harmless
        # default mode (no *_PREVIOUS variable staged), which proves the command
        # still loads, connects and reports honestly instead of doing nothing
        # silently.
        run: |
          node server/scripts/restore-drill.js
          node server/scripts/reconcile-documents.js
          node server/scripts/reseal-keys.js
      - name: Extraction fails closed with no provider enabled
        # The AI journey above runs with the fake provider; this restart proves the
        # SHIPPED default (no provider) fails closed and drafting by hand still works.
        run: |
          kill "$(cat /tmp/api.pid)" 2>/dev/null || true
          for i in $(seq 1 30); do
            curl -fsS http://localhost:4100/api/health >/dev/null 2>&1 && sleep 1 || break
          done
          EXTRACTION_PROVIDER=none node server/src/index.js > /tmp/api-none.log 2>&1 &
          echo $! > /tmp/api.pid
          for i in $(seq 1 60); do
            curl -fsS http://localhost:4100/api/health >/dev/null && break
            sleep 2
          done
          # The journey skips itself when the RUNNER sees the fake provider (the
          # job-level default above), so without this override the step would
          # report green without ever asserting the shipped fail-closed default.
          EXTRACTION_PROVIDER=none npx playwright test e2e/extractions.spec.js -g "no provider enabled"

  security:
    name: Dependency audit and secret scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Production dependency audit
        run: npm audit --omit=dev --audit-level=high
      - name: Secret scan (tree)
        uses: gitleaks/gitleaks-action@ff98106e4c7b2bc287b24eaf42907196329070c7 # v2
        env:
          # v2 REQUIRES a token to scan pull requests; without it the action
          # fails before it scans anything, which is how this job stayed red on
          # every run. The automatic token is read-only and sufficient.
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_ENABLE_UPLOAD_ARTIFACT: "false"
