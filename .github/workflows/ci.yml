name: CI

# Gate: server tests (replica-set MongoDB), client tests + lint + build, browser
# journeys, dependency audit and a Git tree/history secret scan.
#
# Parts 2+ write inside MongoDB transactions, so the database MUST be a replica
# set. Service containers cannot be started with `--replSet`, so each job starts
# a disposable single-node replica set with `docker run` and initiates it.

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  server:
    name: Server tests
    runs-on: ubuntu-latest
    env:
      NODE_ENV: test
      MONGODB_URI: mongodb://127.0.0.1:27017/velora_test?replicaSet=rs0
      MONGODB_TEST_URI: mongodb://127.0.0.1:27017/velora_test?replicaSet=rs0
      CLIENT_ORIGIN: http://localhost:5173
      SESSION_PEPPER: ci_test_session_pepper_0123456789
      MFA_ENCRYPTION_KEY: AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA=
      SESSION_TTL_HOURS: "12"
      DOCUMENT_STORAGE_ROOT: /tmp/velora-documents
      DOCUMENT_ENCRYPTION_KEY: BQUFBQUFBQUFBQUFBQUFBQUFBQUFBQUFBQUFBQUFBQU=
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - name: Start MongoDB replica set
        run: |
          docker run -d --name mongo -p 27017:27017 mongo:7 --replSet rs0 --bind_ip_all
          for i in $(seq 1 30); do
            docker exec mongo mongosh --quiet --eval "db.adminCommand('ping').ok" >/dev/null 2>&1 && break
            sleep 2
          done
          docker exec mongo mongosh --quiet --eval "rs.initiate({_id:'rs0',members:[{_id:0,host:'127.0.0.1:27017'}]})"
          for i in $(seq 1 30); do
            [ "$(docker exec mongo mongosh --quiet --eval 'db.hello().isWritablePrimary')" = "true" ] && break
            sleep 2
          done
      - run: npm ci
      - name: Server tests
        run: npm test -w server

  client:
    name: Client tests, lint and build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - name: Unit tests
        run: npm test -w client
      - name: Lint
        run: npm run lint -w client
      - name: Production build
        run: npm run build -w client

  e2e:
    name: Browser journeys
    runs-on: ubuntu-latest
    needs: [server, client]
    env:
      NODE_ENV: test
      PORT: "4100"
      MONGODB_URI: mongodb://127.0.0.1:27017/velora_e2e?replicaSet=rs0
      CLIENT_ORIGIN: http://localhost:5173
      SESSION_PEPPER: ci_test_session_pepper_0123456789
      MFA_ENCRYPTION_KEY: AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA=
      SESSION_TTL_HOURS: "12"
      DOCUMENT_STORAGE_ROOT: /tmp/velora-documents-e2e
      DOCUMENT_ENCRYPTION_KEY: BQUFBQUFBQUFBQUFBQUFBQUFBQUFBQUFBQUFBQUFBQU=
      VITE_API_PROXY: http://localhost:4100
      E2E_BASE_URL: http://localhost:5173
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - name: Start MongoDB replica set
        run: |
          docker run -d --name mongo -p 27017:27017 mongo:7 --replSet rs0 --bind_ip_all
          for i in $(seq 1 30); do
            docker exec mongo mongosh --quiet --eval "db.adminCommand('ping').ok" >/dev/null 2>&1 && break
            sleep 2
          done
          docker exec mongo mongosh --quiet --eval "rs.initiate({_id:'rs0',members:[{_id:0,host:'127.0.0.1:27017'}]})"
          for i in $(seq 1 30); do
            [ "$(docker exec mongo mongosh --quiet --eval 'db.hello().isWritablePrimary')" = "true" ] && break
            sleep 2
          done
      - name: Install Playwright browser
        run: npx playwright install --with-deps chromium
      - name: Seed synthetic clinic
        run: npm run seed -w server
      - name: Start API
        run: npm run start -w server &
      - name: Start client
        run: npm run dev -w client &
      - name: Wait for stack
        # Readiness is asserted with curl instead of an unpinned `npx wait-on`
        # download: no extra dependency enters the build (control #13, #14).
        run: |
          for i in $(seq 1 60); do
            if curl -fsS http://localhost:4100/api/health >/dev/null && \
               curl -fsS http://localhost:5173 >/dev/null; then
              echo "stack ready"
              exit 0
            fi
            sleep 2
          done
          echo "stack did not become ready" >&2
          exit 1
      - name: Browser journeys
        run: npx playwright test

  security:
    name: Dependency audit and secret scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - name: Production dependency audit
        run: npm audit --omit=dev --audit-level=high
      - name: Secret scan (tree)
        uses: gitleaks/gitleaks-action@v2
        env:
          GITLEAKS_ENABLE_UPLOAD_ARTIFACT: "false"
